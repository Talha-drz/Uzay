
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Grup Takip Sistemi | OCR ile Sayı Takibi</title>
    <!-- Tesseract.js CDN -->
    <script src="https://unpkg.com/tesseract.js@5.0.5/dist/tesseract.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s ease;
            background-color: #f4f7fc;
            padding: 20px;
        }

        /* Ana kart */
        .card {
            max-width: 750px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(2px);
            border-radius: 3rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
            padding: 2rem 1.8rem;
            text-align: center;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.4);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #1e2b3c, #0f4c5c);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }

        .sub {
            color: #2c6979;
            margin-bottom: 1.8rem;
            font-weight: 500;
            border-bottom: 1px solid #cbd5e1;
            display: inline-block;
            padding-bottom: 4px;
        }

        /* video kutusu */
        .camera-box {
            background: #000;
            border-radius: 2rem;
            overflow: hidden;
            margin: 1.2rem 0;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            border: 2px solid #ffffff80;
        }

        video {
            width: 100%;
            height: auto;
            display: block;
            background: #1a2a2f;
            transform: scaleX(1);
        }

        /* buton */
        .btn-primary {
            background: #0f4c5c;
            border: none;
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 1rem 1.8rem;
            border-radius: 4rem;
            cursor: pointer;
            margin: 0.8rem 0 1rem 0;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 5px 0 #06262e;
            letter-spacing: 1px;
        }

        .btn-primary:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #06262e;
        }

        .btn-primary:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
        }

        /* bilgi paneli */
        .info-panel {
            background: #eef2f5;
            border-radius: 1.8rem;
            padding: 1rem 1.2rem;
            margin: 1rem 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 1rem;
            font-weight: 600;
        }

        .info-card {
            background: white;
            border-radius: 1.5rem;
            padding: 0.8rem 1rem;
            flex: 1;
            min-width: 110px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }

        .info-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #2c6979;
            font-weight: 700;
        }

        .info-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.2;
            color: #1e2b3c;
            word-break: break-word;
        }

        .timer-value {
            font-family: monospace;
            font-size: 2.2rem;
            letter-spacing: 2px;
        }

        .status-badge {
            background: #f0f3f8;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e4663;
            margin-top: 0.6rem;
            display: inline-block;
        }

        .error-msg {
            color: #c7254e;
            background: #f9e6eb;
            border-radius: 2rem;
            padding: 0.4rem 1rem;
            font-size: 0.8rem;
            margin-top: 0.8rem;
        }

        footer {
            font-size: 0.7rem;
            margin-top: 1.4rem;
            color: #5f7f8c;
        }

        @media (max-width: 550px) {
            .card {
                padding: 1.2rem;
            }
            .info-value {
                font-size: 1.5rem;
            }
            .btn-primary {
                font-size: 1.3rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>

<div class="card" id="appContainer">
    <h1>📸 Grup Takip Sistemi</h1>
    <div class="sub">OCR ile Sayı Kontrolü</div>

    <!-- Kamera görüntüsü -->
    <div class="camera-box">
        <video id="video" autoplay playsinline muted></video>
    </div>

    <!-- Buton -->
    <button id="saveBtn" class="btn-primary">🎯 Grup Boş Kaydet</button>

    <!-- Bilgi kartları -->
    <div class="info-panel">
        <div class="info-card">
            <div class="info-label">🔢 ANLIK OKUNAN SAYI</div>
            <div class="info-value" id="currentNumberDisplay">—</div>
        </div>
        <div class="info-card">
            <div class="info-label">📌 REFERANS SAYI</div>
            <div class="info-value" id="referenceDisplay">—</div>
        </div>
        <div class="info-card">
            <div class="info-label">⏳ KALAN SÜRE</div>
            <div class="info-value timer-value" id="timerDisplay">—</div>
        </div>
    </div>

    <div id="statusMessage" class="status-badge">⚙️ Sistem beklemede | Butona basarak başlatın</div>
    <div id="errorMsg" class="error-msg" style="display: none;"></div>
    <footer>Kamera sayı okumak için net bir alana yöneltin (rakamlar)</footer>
</div>

<script>
    // -------- DOM ELEMANLARI ----------
    const video = document.getElementById('video');
    const saveBtn = document.getElementById('saveBtn');
    const currentNumberSpan = document.getElementById('currentNumberDisplay');
    const referenceSpan = document.getElementById('referenceDisplay');
    const timerDisplaySpan = document.getElementById('timerDisplay');
    const statusDiv = document.getElementById('statusMessage');
    const errorDiv = document.getElementById('errorMsg');

    // -------- GLOBAL STATE ----------
    let referenceNumber = null;           // kaydedilen referans sayı (int)
    let isWaiting = false;                // 60 saniye bekleme modu (kontrol yok)
    let isComparingMode = false;          // periyodik karşılaştırma aktif mi
    let countdownInterval = null;         // geri sayım interval id
    let compareInterval = null;            // 1 saniyelik OCR karşılaştırma interval
    let isOcrRunning = false;              // aynı anda birden çok OCR çalışmasın
    let tesseractWorker = null;            // worker nesnesi

    // kamera stream
    let mediaStream = null;

    // -------- Helper: hata göster ----------
    function showError(msg, duration = 3000) {
        errorDiv.innerText = msg;
        errorDiv.style.display = 'block';
        setTimeout(() => {
            if (errorDiv) errorDiv.style.display = 'none';
        }, duration);
    }

    // -------- Arka plan rengini sıfırla (nötr) ----------
    function resetBackground() {
        document.body.style.backgroundColor = '#f4f7fc';
    }

    // -------- Arka planı duruma göre ayarla (sadece karşılaştırma modunda ve sayı geçerliyse) ----------
    function setBackgroundByComparison(currentNum) {
        // sadece karşılaştırma modunda, bekleme değil ve referans var
        if (!isComparingMode || isWaiting || referenceNumber === null) return;
        if (currentNum === null || isNaN(currentNum)) {
            // geçersiz sayı okunursa arka planı bozma, nötr tut
            return;
        }
        if (currentNum <= referenceNumber) {
            document.body.style.backgroundColor = '#2b8c4a'; // yeşil ton
        } else {
            document.body.style.backgroundColor = '#c73f2c'; // kırmızı ton
        }
    }

    // -------- Tesseract worker başlatma (sadece rakamlar için optimize) ----------
    async function initTesseract() {
        try {
            if (tesseractWorker) return tesseractWorker;
            // worker oluştur (ingilizce, ama rakamlar için whitelist)
            const worker = await Tesseract.createWorker('eng', 1, {
                logger: m => {} // sessiz mod, log istemiyoruz
            });
            // sadece rakamları tanıması için whitelist
            await worker.setParameters({
                tessedit_char_whitelist: '0123456789',
                tessedit_ocr_engine_mode: '3'
            });
            tesseractWorker = worker;
            return worker;
        } catch (err) {
            console.error("Tesseract başlatılamadı:", err);
            showError("OCR motoru başlatılamadı! Sayfa yenileyin.");
            return null;
        }
    }

    // -------- Video frame'den canvas üretip OCR ile sayı okuma ----------
    async function readNumberFromCamera() {
        if (!video.videoWidth || !video.videoHeight) {
            return null;
        }
        if (!tesseractWorker) {
            await initTesseract();
            if (!tesseractWorker) return null;
        }

        // canvas oluştur, video anlık görüntü al
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        
        try {
            // Tesseract ile tanıma
            const { data: { text } } = await tesseractWorker.recognize(canvas);
            // text içinden ilk rakam grubunu bul
            const matches = text.match(/\d+/g);
            if (matches && matches.length > 0) {
                const firstNumber = parseInt(matches[0], 10);
                if (!isNaN(firstNumber)) {
                    return firstNumber;
                }
            }
            return null;
        } catch (err) {
            console.warn("OCR okuma hatası:", err);
            return null;
        }
    }

    // -------- Tek seferlik OCR çağrısı (buton için referans okuma) ----------
    async function captureReferenceNumber() {
        statusDiv.innerText = "🔍 Sayı okunuyor, lütfen bekleyin...";
        saveBtn.disabled = true;
        const number = await readNumberFromCamera();
        saveBtn.disabled = false;
        if (number !== null && !isNaN(number)) {
            referenceNumber = number;
            referenceSpan.innerText = referenceNumber;
            statusDiv.innerText = `✅ Referans sayı ${referenceNumber} kaydedildi. 60 saniye bekleme başladı.`;
            showError("", 0);
            return true;
        } else {
            statusDiv.innerText = "❌ Sayı okunamadı! Kamerayı net rakamlara yöneltip tekrar deneyin.";
            showError("Sayı okunamadı, lütfen kamerada belirgin rakamlar olduğundan emin olun.", 4000);
            return false;
        }
    }

    // -------- Karşılaştırma için OCR + UI güncelleme (her saniye) ----------
    async function performComparisonOCR() {
        // sadece karşılaştırma modunda ve bekleme değilse
        if (!isComparingMode || isWaiting) return;
        if (isOcrRunning) {
            // önceki OCR hala devam ediyor, atla
            return;
        }
        isOcrRunning = true;
        try {
            const scannedNumber = await readNumberFromCamera();
            let displayVal = "—";
            let numericVal = null;
            if (scannedNumber !== null && !isNaN(scannedNumber)) {
                displayVal = scannedNumber;
                numericVal = scannedNumber;
            } else {
                displayVal = "❓ Geçersiz";
                numericVal = null;
            }
            // anlık sayıyı göster
            currentNumberSpan.innerText = displayVal;
            
            // arka plan güncellemesi (sadece numeric geçerli ise)
            if (numericVal !== null && referenceNumber !== null && !isWaiting && isComparingMode) {
                setBackgroundByComparison(numericVal);
            } else if (numericVal === null && isComparingMode && !isWaiting) {
                // okunamadıysa arka planı değiştirme (koru ama durum mesajı eklenebilir)
                // herhangi bir hatalı durumda background resetlenmez, sadece son durumu korur.
                // ama kullanıcıya bilgi verelim
                if(!document.getElementById('ocrHint')) {
                    // küçük ipucu
                }
            }
        } catch (err) {
            console.error("Karşılaştırma OCR hatası", err);
        } finally {
            isOcrRunning = false;
        }
    }

    // -------- Periyodik karşılaştırmayı başlat (her 1 saniye) ----------
    function startComparisonLoop() {
        if (compareInterval) {
            clearInterval(compareInterval);
            compareInterval = null;
        }
        isComparingMode = true;
        isWaiting = false;
        // hemen ilk okumayı yap
        performComparisonOCR();
        // ardından her 1000ms'de bir OCR ve karşılaştırma
        compareInterval = setInterval(() => {
            if (isComparingMode && !isWaiting) {
                performComparisonOCR();
            }
        }, 1000);
    }

    // -------- Geri sayım başlat (60 saniye) ----------
    function startCountdown(seconds = 60) {
        if (countdownInterval) clearInterval(countdownInterval);
        let remaining = seconds;
        timerDisplaySpan.innerText = `${remaining} sn`;
        
        countdownInterval = setInterval(() => {
            if (!isWaiting) {
                // Eğer waiting modu dışarıdan false olursa (manuel reset) interval temizlenmeli
                if (countdownInterval) clearInterval(countdownInterval);
                return;
            }
            remaining--;
            if (remaining <= 0) {
                // süre bitti
                clearInterval(countdownInterval);
                countdownInterval = null;
                if (isWaiting === true) {
                    // bekleme bitti, karşılaştırma moduna geç
                    isWaiting = false;
                    statusDiv.innerText = "⏰ 60 saniye doldu! Şimdi her saniye karşılaştırma yapılıyor...";
                    timerDisplaySpan.innerText = "0 sn";
                    // Karşılaştırma döngüsünü başlat
                    startComparisonLoop();
                }
            } else {
                timerDisplaySpan.innerText = `${remaining} sn`;
            }
        }, 1000);
    }

    // -------- Tüm zamanlayıcıları ve kontrolleri durdur (sıfırlama) ----------
    function haltAllTimersAndComparisons() {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        if (compareInterval) {
            clearInterval(compareInterval);
            compareInterval = null;
        }
        isComparingMode = false;
        isWaiting = false;
        // Arka planı nötr yap
        resetBackground();
    }

    // -------- "Grup Boş Kaydet" butonu ana aksiyonu ----------
    async function onSaveButtonClick() {
        // 1. Önceki tüm işlemleri durdur (sıfırla)
        haltAllTimersAndComparisons();
        
        // 2. UI sıfırlamalar (arka plan nötr, anlık sayıyı sıfırla)
        currentNumberSpan.innerText = "—";
        timerDisplaySpan.innerText = "—";
        // referans sayı eski değeri temizleme (yeni okuma başarılı olursa değişecek)
        // ama geçici olarak eski referans gözükmesin? değişecek.
        // durum mesajı
        statusDiv.innerText = "📷 Kameradan referans sayı okunuyor...";
        
        // 3. Kameradan sayı oku (OCR)
        const success = await captureReferenceNumber();
        if (!success) {
            // okuma başarısız: her şey durduruldu, referans kaydedilmedi, sistem beklemede kalmasın.
            referenceNumber = null;
            referenceSpan.innerText = "—";
            statusDiv.innerText = "❌ Sayı okunamadı. Lütfen kamerayı net bir rakama yöneltip tekrar deneyin.";
            resetBackground();
            // timer ve diğer state'ler zaten kapalı
            return;
        }
        
        // 4. Referans başarıyla kaydedildi, şimdi 60 saniye bekleme modu (hiçbir kontrol yok)
        // Önce karşılaştırma döngüsü varsa temizlendi, bekleme modu aktif
        isWaiting = true;
        isComparingMode = false;   // karşılaştırma modu pasif
        // bekleme süresince anlık okunan sayı gösterilmesin, "beklemede" gösterelim
        currentNumberSpan.innerText = "⏳ Beklemede";
        // Arka plan nötr tut
        resetBackground();
        
        // Geri sayımı başlat (60 sn)
        startCountdown(60);
        statusDiv.innerText = `⏱️ Referans: ${referenceNumber} — 60 saniye boyunca hiçbir kontrol yapılmayacak.`;
    }
    
    // -------- Kamerayı başlat (getUserMedia) ----------
    async function initCamera() {
        try {
            if (mediaStream) {
                // zaten varsa durdur
                mediaStream.getTracks().forEach(track => track.stop());
            }
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
            mediaStream = stream;
            video.srcObject = stream;
            await video.play();
            statusDiv.innerText = "✅ Kamera aktif. Butona basarak referans sayı kaydedin.";
        } catch (err) {
            console.error("Kamera erişim hatası:", err);
            statusDiv.innerText = "⚠️ Kamera erişilemedi! Lütfen izin verin.";
            showError("Kamera izni gerekli. Tarayıcı ayarlarını kontrol edin.", 5000);
        }
    }

    // -------- Tüm sistem başlangıcı: worker + kamera ----------
    async function initSystem() {
        // Önce tesseract worker'ı arka planda başlat
        await initTesseract();
        // Kamera başlat
        await initCamera();
        // buton olayını bağla
        saveBtn.addEventListener('click', onSaveButtonClick);
        // Başlangıçta state temiz
        haltAllTimersAndComparisons();
        referenceNumber = null;
        referenceSpan.innerText = "—";
        currentNumberSpan.innerText = "—";
        timerDisplaySpan.innerText = "—";
        resetBackground();
        statusDiv.innerText = "🎥 Kamera hazır. 'Grup Boş Kaydet' ile referans oluşturun.";
    }

    // Sayfa yüklendiğinde başlat
    window.addEventListener('DOMContentLoaded', initSystem);
    
    // Sayfa kapatılırken stream'i durdur ve worker'ı sonlandır (opsiyonel)
    window.addEventListener('beforeunload', () => {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }
        if (tesseractWorker) {
            tesseractWorker.terminate();
        }
        if (countdownInterval) clearInterval(countdownInterval);
        if (compareInterval) clearInterval(compareInterval);
    });
</script>
</body>
</html>
